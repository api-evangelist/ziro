aid: ziro
name: Ziro
description: >-
  Zíro (somosziro.com) is a Colombian fintech that provides interest-free credit
  for small retailers in the traditional commerce channel. Its platform lets
  distributors and manufacturers extend "crédito sin intereses" to the small
  shops they supply, while the supplier receives guaranteed payment and Zíro
  assumes the credit risk. The service bundles identity verification (Colombian
  cédula), automated credit evaluation, and fraud prevention into the ordering
  flow. Zíro is a 500 Global portfolio company. As of this enrichment pass the
  company exposes only a public marketing site and a customer-facing credit
  application (an Angular SPA at creditos.somosziro.com); no public developer
  portal, API documentation, OpenAPI/AsyncAPI specification, SDK, or MCP server
  was found. The api.somosziro.com host exists but responds 403 (internal, not
  publicly documented).
